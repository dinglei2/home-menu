<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB088"/>
      <stop offset="100%" stop-color="#FF7E5F"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#FFE8D0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E85A3A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 蒸汽 -->
  <g stroke="#FFF" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M200 120 Q210 100 200 80 Q190 60 200 45"/>
    <path d="M256 110 Q266 90 256 70 Q246 50 256 35"/>
    <path d="M312 120 Q322 100 312 80 Q302 60 312 45"/>
  </g>
  <!-- 锅盖 -->
  <ellipse cx="256" cy="200" rx="140" ry="32" fill="#FFD4B8" filter="url(#shadow)"/>
  <ellipse cx="256" cy="195" rx="135" ry="26" fill="#FFE8D0"/>
  <!-- 锅盖把手 -->
  <circle cx="256" cy="175" r="18" fill="#FF9F7A"/>
  <circle cx="256" cy="172" r="13" fill="#FFB998"/>
  <!-- 锅身 -->
  <path d="M128 200 Q128 360 256 380 Q384 360 384 200 Z" fill="url(#pot)" filter="url(#shadow)"/>
  <path d="M140 210 Q140 350 256 368 Q372 350 372 210" fill="#FFFAF2"/>
  <!-- 可爱表情 -->
  <!-- 腮红 -->
  <ellipse cx="190" cy="290" rx="20" ry="12" fill="#FFB088" opacity="0.6"/>
  <ellipse cx="322" cy="290" rx="20" ry="12" fill="#FFB088" opacity="0.6"/>
  <!-- 眼睛 -->
  <ellipse cx="218" cy="270" rx="12" ry="15" fill="#5C3A28"/>
  <ellipse cx="294" cy="270" rx="12" ry="15" fill="#5C3A28"/>
  <!-- 眼睛高光 -->
  <circle cx="222" cy="265" r="4.5" fill="#FFF"/>
  <circle cx="298" cy="265" r="4.5" fill="#FFF"/>
  <!-- 嘴巴 -->
  <path d="M236 305 Q256 325 276 305" stroke="#5C3A28" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- 小舌头 -->
  <ellipse cx="256" cy="314" rx="6" ry="4" fill="#FF7E5F"/>
  <!-- 锅耳 -->
  <ellipse cx="120" cy="210" rx="14" ry="20" fill="#FFD4B8"/>
  <ellipse cx="392" cy="210" rx="14" ry="20" fill="#FFD4B8"/>
  <!-- 底部小装饰 -->
  <circle cx="160" cy="400" r="6" fill="#FFF" opacity="0.5"/>
  <circle cx="352" cy="400" r="6" fill="#FFF" opacity="0.5"/>
  <circle cx="256" cy="420" r="5" fill="#FFF" opacity="0.4"/>
</svg>
