# Render.com 一键部署配置文件
# 使用方法：
# 1. 注册 Render.com 账号（可用 GitHub 登录）
# 2. 将本项目推送到 GitHub 仓库
# 3. 在 Render Dashboard 点击 "New +" → "Blueprint"
# 4. 选择你的仓库，Render 会自动识别此文件
# 5. 点击 "Apply" 即可完成部署
# 6. 部署完成后获得 https://xxx.onrender.com 地址
# 7. 在家常小厨房 App → 我的 → 同步设置 中填入该地址
#
# 持久化存储说明：
# Render 免费版文件系统重启后丢失，所以使用 Upstash Redis 做持久化。
# 部署前请先创建 Upstash Redis 数据库（免费）：
# 1. 访问 https://console.upstash.com 注册账号
# 2. 创建一个 Redis 数据库（Free 版，选离你近的区域）
# 3. 在数据库详情页找到 REST API 部分
# 4. 复制 UPSTASH_REDIS_REST_URL 和 UPSTASH_REDIS_REST_TOKEN
# 5. 在 Render 的环境变量中填入这两个值

services:
  - type: web
    name: jia-chang-xiao-chu-fang
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
